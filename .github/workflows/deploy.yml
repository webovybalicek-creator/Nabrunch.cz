name: Build a deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Po stažení obrázků (bot commit sám deploy nespustí)
  workflow_run:
    workflows: ['Stažení obrázků']
    types: [completed]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      ECOMAIL_API_KEY: ${{ secrets.ECOMAIL_API_KEY }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      # Cílová doména – po spuštění ostrého webu nastavit proměnnou SITE_HOST na nabrunch.cz
      SITE_HOST: ${{ vars.SITE_HOST || 'nabrunch.cz' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Konfigurace serveru (API klíče a hesla jen na serveru, ne v repozitáři)
        run: |
          python3 - <<'PY'
          import os
          esc = lambda v: v.replace('\\', '\\\\').replace("'", "\\'")
          k = {'ecomail': os.environ.get('ECOMAIL_API_KEY', ''), 'smtp_heslo': os.environ.get('SMTP_PASSWORD', '')}
          radky = ''.join(f"  '{n}' => '{esc(v)}',\n" for n, v in k.items() if v)
          open('dist/api/_konfig.php', 'w').write(f"<?php\nreturn [\n{radky}];\n")
          for n, v in k.items():
              print(f"::{'notice' if v else 'warning'}::{n}: {'nastaveno' if v else 'chybí secret'}")
          PY

      - name: Kontrola přístupových údajů
        if: env.FTP_PASSWORD == ''
        run: echo "::warning::Chybí secret FTP_PASSWORD – web je sestavený, ale nenahrál se na hosting."

      - name: Cílová složka na FTP
        if: env.FTP_PASSWORD != ''
        run: |
          # Účet s kořenem celého hostingu (vidí složku nabrunch.cz) → nahrávat do nabrunch.cz/web/,
          # účet s kořenem přímo ve složce webu → do kořene. Zbytky po nepovedených deployích v kořeni uklidit.
          F="--ssl-reqd --insecure --disable-epsv --user $FTP_USERNAME:$FTP_PASSWORD"
          LS=$(curl -sS $F --list-only "ftp://$FTP_SERVER/" || true)
          if printf '%s\n' "$LS" | grep -qx 'nabrunch.cz'; then DIR='nabrunch.cz/web/'; else DIR=''; fi
          echo "FTP_DIR=$DIR" >> "$GITHUB_ENV"
          echo "::notice::Cílová složka na FTP: /${DIR}"
          for f in $(printf '%s\n' "$LS" | grep -E '^(_site-[0-9a-f]+\.zip|_deploy-[0-9a-f]+\.php)$'); do
            [ -n "$DIR" ] && curl -sS $F -Q "DELE $f" "ftp://$FTP_SERVER/" -o /dev/null && echo "Smazán zbytek: $f"
          done

      - name: Příprava rozbalovače
        if: env.FTP_PASSWORD != ''
        run: |
          RAND=$(openssl rand -hex 12)
          TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$TOKEN"
          HASH=$(printf '%s' "$TOKEN" | sha256sum | cut -d' ' -f1)
          ZIP="_site-$RAND.zip"
          PHP="_deploy-$RAND.php"
          sed -e "s/__TOKEN_HASH__/$HASH/" -e "s/__ZIP_NAME__/$ZIP/" deploy/deploy.php > "$PHP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "PHP=$PHP" >> "$GITHUB_ENV"
          echo "DEPLOY_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          curl -sS --fail --ssl-reqd --insecure --retry 3 --user "$FTP_USERNAME:$FTP_PASSWORD" -T "$PHP" "ftp://$FTP_SERVER/${FTP_DIR}$PHP"

      - name: Porovnání se serverem (jen změněné soubory)
        if: env.FTP_PASSWORD != ''
        shell: bash
        run: |
          set -uo pipefail
          chyba() { echo "::error::$1"; exit 1; }
          (cd dist && find . -type f -print0 | sort -z | xargs -0 md5sum | sed -E 's#^([0-9a-f]+)  \./(.*)$#\2\t\1#') > novy-manifest.txt || chyba "výpočet otisků selhal"
          curl -sS --max-time 120 -X POST -H "X-Deploy-Token: $DEPLOY_TOKEN" -d akce=manifest "https://$SITE_HOST/$PHP" -o stary-manifest.txt || : > stary-manifest.txt
          echo "::notice::Starý manifest: $(wc -l < stary-manifest.txt) řádků, s otisky: $(grep -cP '\t[0-9a-f]{32}$' stary-manifest.txt || true)"
          # Starý manifest bez otisků (první přírůstkový deploy) → nahrát vše
          if [ "$(grep -cP '\t[0-9a-f]{32}$' stary-manifest.txt || true)" -gt 100 ]; then
            awk -F'\t' 'NR==FNR { s[$1]=$2; next } s[$1] != $2 { print $1 }' stary-manifest.txt novy-manifest.txt > zmenene.txt || chyba "porovnání selhalo"
          else
            cut -f1 novy-manifest.txt > zmenene.txt
          fi
          echo "::notice::Změněných souborů: $(wc -l < zmenene.txt) z $(wc -l < novy-manifest.txt)"
          cp novy-manifest.txt dist/.deploy-manifest-new.txt
          echo ".deploy-manifest-new.txt" >> zmenene.txt
          python3 - "$ZIP" <<'PY' || chyba "vytvoření ZIPu selhalo"
          import sys, zipfile, os
          cil = sys.argv[1]
          with open('zmenene.txt', encoding='utf-8') as f:
              soubory = [r.rstrip('\n') for r in f if r.strip()]
          with zipfile.ZipFile(cil, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for s in soubory:
                  z.write(os.path.join('dist', s), s)
          print(f'ZIP: {len(soubory)} souborů, {os.path.getsize(cil) / 1e6:.1f} MB')
          PY

      - name: Nahrání ZIPu (FTPS)
        if: env.FTP_PASSWORD != ''
        run: |
          curl -sS --fail --ssl-reqd --insecure --retry 3 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            -T "$ZIP" "ftp://$FTP_SERVER/${FTP_DIR}$ZIP"

      - name: Rozbalení na serveru
        if: env.FTP_PASSWORD != ''
        run: |
          for scheme in https http; do
            if out=$(curl -sS --fail --max-time 600 -X POST -H "X-Deploy-Token: $DEPLOY_TOKEN" -d akce=rozbalit "$scheme://$SITE_HOST/$PHP" 2>&1); then
              echo "$out"
              echo "::notice::$out"
              exit 0
            fi
            echo "$scheme: $out"
          done
          echo "::error::Rozbalení na serveru selhalo"
          exit 1
