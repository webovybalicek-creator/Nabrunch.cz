name: Kontrola URL

# Vypíše stavový kód a cíl přesměrování pro zadané cesty (např. staré adresy z WordPressu).
on:
  workflow_dispatch:
    inputs:
      cesty:
        description: 'Cesty oddělené mezerou'
        default: '/ /lokalita/praha/'

jobs:
  url:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_HOST: ${{ vars.SITE_HOST || 'nabrunch.cz' }}
      CESTY: ${{ inputs.cesty }}
    steps:
      - run: |
          for c in $CESTY; do
            r=$(curl -s -D h.txt -o b.html -w '%{http_code} %{redirect_url}' "https://$SITE_HOST$c")
            t=$(grep -o '<title>[^<]*' b.html | head -1 | sed 's/<title>//')
            g=$(grep -o '<meta name="generator"[^>]*' b.html | head -1)
            k=$(grep -iE '^(x-cache|age|x-varnish|cache-control|server|via):' h.txt | tr -d '\r' | tr '\n' ' ')
            echo "::notice title=$c::$r | $t | $g | $k"
            sleep 0.5
          done
