name: Stažení obrázků

# Stáhne obrázky z WordPressu (nabrunch.cz) podle scripts/obrazky.json, převede je na WebP a commitne do repa.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/obrazky.json']

permissions:
  contents: write

concurrency:
  group: obrazky
  cancel-in-progress: false

jobs:
  obrazky:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/stahni-obrazky.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add public/obrazky public/nahledy public/favicon.png
          if git diff --cached --quiet; then echo "Žádné nové obrázky"; exit 0; fi
          git commit -m "Obrázky z WordPressu ($(git diff --cached --name-only | wc -l) souborů)"
          git push
