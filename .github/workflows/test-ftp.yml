name: Test FTP (testovací stránka)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      # Cílová složka na FTP – účet new.nabrunch.cz vede rovnou do složky subdomény
      FTP_DIR: ${{ vars.FTP_DIR || '.' }}
    steps:
      - uses: actions/checkout@v4

      - name: Kontrola přístupových údajů
        run: |
          for s in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!s}" ]; then echo "::error::Chybí secret $s"; exit 1; fi
          done

      - name: Výpis kořene FTP (pro kontrolu složek)
        continue-on-error: true
        run: curl -sS --ssl-reqd --insecure --user "$FTP_USERNAME:$FTP_PASSWORD" --list-only "ftp://$FTP_SERVER/"

      - name: Nahrání index.html do složky subdomény
        run: |
          sed "s/__DEPLOY_TIME__/$(TZ=Europe/Prague date '+%-d. %-m. %Y %H:%M')/" index.html > upload.html
          curl -sS --fail --ssl-reqd --insecure --retry 3 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            -T upload.html "ftp://$FTP_SERVER/${FTP_DIR%/}/index.html"
          echo "::notice::Nahráno do ${FTP_DIR%/}/index.html → https://new.nabrunch.cz/"

      - name: Ověření z webu
        continue-on-error: true
        run: |
          sleep 5
          curl -sS --max-time 20 https://new.nabrunch.cz/ | grep -q 'new.nabrunch.cz funguje' \
            && echo "::notice::✅ https://new.nabrunch.cz/ vrací testovací stránku" \
            || echo "::warning::Stránka se nahrála, ale web ji zatím nevrací (DNS, SSL nebo document root subdomény)"
